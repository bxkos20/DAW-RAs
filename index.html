        // --- ESTADO DE LA APLICACIÓN ---
        let currentCourse = 'curso1';
        let currentModule = DAW_DATA['curso1'].modules[1]; // Por defecto Base de datos que tiene info real

        // --- FUNCIONES DE RENDERIZADO ---

        function setCourse(courseId) {
            currentCourse = courseId;
            
            // Estilos de los botones de curso
            document.getElementById('btn-curso1').className = `flex-1 py-2 px-4 rounded-lg font-medium transition-colors ${courseId === 'curso1' ? 'bg-blue-100 text-blue-700 shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`;
            document.getElementById('btn-curso2').className = `flex-1 py-2 px-4 rounded-lg font-medium transition-colors ${courseId === 'curso2' ? 'bg-blue-100 text-blue-700 shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`;
            
            // Seleccionar el primer módulo del curso por defecto al cambiar
            currentModule = DAW_DATA[courseId].modules[0];
            
            renderModules();
            renderContent();
        }

        function setModule(moduleId) {
            currentModule = DAW_DATA[currentCourse].modules.find(m => m.id === moduleId);
            renderModules(); // Re-render para actualizar el módulo activo (estilos)
            renderContent();
        }

        function renderModules() {
            const modulesList = document.getElementById('modules-list');
            const modules = DAW_DATA[currentCourse].modules;
            
            modulesList.innerHTML = modules.map(mod => {
                const isActive = mod.id === currentModule.id;
                return `
                    <li>
                        <button 
                            onclick="setModule('${mod.id}')"
                            class="w-full text-left px-3 py-2.5 rounded-lg transition-colors text-sm font-medium ${
                                isActive 
                                ? 'bg-blue-600 text-white shadow-md' 
                                : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                            }">
                            ${mod.name}
                        </button>
                    </li>
                `;
            }).join('');
        }

        function renderContent() {
            // Actualizar Cabecera
            document.getElementById('module-title').textContent = currentModule.name;
            
            const raContainer = document.getElementById('ra-container');
            
            if (!currentModule.ras || currentModule.ras.length === 0) {
                raContainer.innerHTML = `<div class="p-4 bg-yellow-50 text-yellow-700 rounded-lg text-sm">Información no disponible. Rellenar en el JSON.</div>`;
                return;
            }

            // Generar RAs y CEs
            raContainer.innerHTML = currentModule.ras.map((ra, index) => {
                // Comprobación visual para avisar al usuario de los datos faltantes
                const isDummy = ra.title.includes('[COMPLETAR');
                const borderClass = isDummy ? 'border-orange-200' : 'border-slate-200';
                const bgClass = isDummy ? 'bg-orange-50' : 'bg-white hover:bg-slate-50';

                return `
                    <div class="border ${borderClass} rounded-xl overflow-hidden mb-3 bg-white shadow-sm">
                        <button 
                            class="w-full text-left px-5 py-4 ${bgClass} flex justify-between items-center transition-colors focus:outline-none"
                            onclick="toggleAccordion(${index})">
                            <span class="font-semibold text-slate-800 pr-4">${ra.title}</span>
                            <svg id="chevron-${index}" class="w-5 h-5 text-slate-400 shrink-0 chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div id="content-${index}" class="accordion-content px-5 bg-slate-50 border-t border-slate-100">
                            <h4 class="text-sm font-bold text-slate-500 mb-2 uppercase tracking-wide">Criterios de Evaluación:</h4>
                            <ul class="space-y-2">
                                ${ra.ces.map(ce => `
                                    <li class="text-slate-700 text-sm flex items-start">
                                        <span class="text-blue-500 mr-2 mt-0.5">•</span>
                                        <span>${ce}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- LÓGICA DEL ACORDEÓN ---
        function toggleAccordion(index) {
            const content = document.getElementById(`content-${index}`);
            const chevron = document.getElementById(`chevron-${index}`);
            
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                chevron.classList.remove('rotate');
            } else {
                // Opcional: Cerrar los demás acordeones al abrir uno nuevo
                /*
                document.querySelectorAll('.accordion-content').forEach(el => el.classList.remove('open'));
                document.querySelectorAll('.chevron').forEach(el => el.classList.remove('rotate'));
                */
                content.classList.add('open');
                chevron.classList.add('rotate');
            }
        }

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            // Inicializar vista (Por defecto Base de Datos)
            setCourse('curso1');
        });

    </script>
